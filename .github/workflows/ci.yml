# The rules it holds: [QSWRK#tooling].
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Read-only: no job here writes to the repository, publishes, or
# touches a package registry.
permissions:
  contents: read

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint

  conventions:
    name: Doc / convention checks
    runs-on: ubuntu-latest
    steps:
      # The probes compare the tree with commits of its history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build -w @kaluchi/qlang-core
      - run: npm run check:conventions
      - run: npm run check:probes

  workspace-tests:
    name: ${{ matrix.workspace }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@kaluchi/qlang-core"
          - "@kaluchi/qlang-cli"
          - "@kaluchi/qlang-lsp"
          - "@kaluchi/qlang-site"
          - "qlang-vscode"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build -w @kaluchi/qlang-core
      - run: npm test -w ${{ matrix.workspace }}

  coverage:
    name: ${{ matrix.workspace }} coverage thresholds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@kaluchi/qlang-core"
          - "@kaluchi/qlang-cli"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build -w @kaluchi/qlang-core
      - run: npm run test:coverage -w ${{ matrix.workspace }}

  integration:
    name: ${{ matrix.workspace }} integration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@kaluchi/qlang-cli"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build -w @kaluchi/qlang-core
      - run: npm run test:integration -w ${{ matrix.workspace }}

  # The build of the site, the `astro build` the Pages workflow runs on a
  # push to master, the one job that bundles the core by Vite's SSR,
  # `package.json#sideEffects` and `astro.config.mjs#vite.environments` among
  # what it reads [QSWRK#tooling].
  site-build:
    name: Astro site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build -w @kaluchi/qlang-core
      - run: npm run build -w @kaluchi/qlang-site

  all-green:
    name: All checks passed
    if: always()
    needs: [lint, conventions, workspace-tests, coverage, integration, site-build]
    runs-on: ubuntu-latest
    steps:
      # Every needed job must report `success`. Naming the failing
      # states instead would let `skipped` through — a matrix entry
      # that never ran, or one whose own dependency was skipped,
      # would report this gate green to branch protection.
      - name: Verify every job succeeded
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [[ "$result" != "success" ]]; then
              echo "a required job reported '$result'"
              exit 1
            fi
          done
