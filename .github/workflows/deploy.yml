name: Deploy

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Publish ${{ matrix.workspace }} to npm
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC): the registry mints the publish
    # credential from this token, matched against the package's
    # trusted-publisher entry (repository + this workflow's file
    # name). No long-lived npm token takes part.
    permissions:
      contents: read
      id-token: write
    strategy:
      # Core is built first — other workspaces that import from it
      # at test time need the generated artefacts. Serial publish
      # keeps the npm-registry transition visible per package.
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - workspace: "@kaluchi/qlang-core"
            dir: core
          - workspace: "@kaluchi/qlang-cli"
            dir: cli
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build -w @kaluchi/qlang-core
      - run: npm test --workspaces --if-present
      - run: npm run test:coverage -w @kaluchi/qlang-core

      - name: Align version with tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version -w ${{ matrix.workspace }}

      # The npm that ships with Node 22 predates OIDC exchange. The
      # upgrade lands after `npm ci` so the install keeps the
      # bundled npm's semantics, and stays inside the 11.x line so
      # npm 12's opt-in install defaults do not reach this job.
      - name: Install an npm that speaks OIDC
        run: npm install -g npm@^11.5.1

      # Publishing from the package directory rather than through
      # `-w` keeps the OIDC exchange addressed at one package: the
      # registry resolves the trusted publisher by the package name
      # the manifest in this directory declares.
      - name: Publish
        working-directory: ${{ matrix.dir }}
        run: npm publish --access public

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
